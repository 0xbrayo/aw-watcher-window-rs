name: Build and Release Binaries

on:
  push:
    tags:
      - "v*.*.*"

jobs:
  build:
    name: Build Binary
    runs-on: macos-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Build project
        run: cargo build --release

      - name: Rename binary
        run: |
          cd target/release
          mv aw-watcher-window-rs aw-watcher-window-rs-macos

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: aw-watcher-window-rs-macos
          path: target/release/aw-watcher-window-rs-macos

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Zip artifacts
        run: |
          cd artifacts
          for dir in */; do
            name="${dir%/}"
            (
              cd "$name"
              zip "../${name}.zip" *
            )
          done
          ls -la

      - name: Create Release
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          draft: true
          prerelease: false
          files: |
            artifacts/*.zip
